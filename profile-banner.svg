<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">kraqinc — software and AI development</title>
  <desc id="desc">A dark terminal-inspired banner with a teal gradient, code symbols, and the tagline Build useful things.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="0.55" stop-color="#101b2d"/>
      <stop offset="1" stop-color="#092c31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9fb3c8" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1030" cy="78" r="112" fill="#14b8a6" opacity=".15" filter="url(#glow)"/>
  <circle cx="950" cy="260" r="95" fill="#3b82f6" opacity=".13" filter="url(#glow)"/>
  <rect x="56" y="48" width="1088" height="224" rx="18" fill="#07111c" fill-opacity=".55" stroke="#cbd5e1" stroke-opacity=".17"/>
  <circle cx="84" cy="76" r="5" fill="#fb7185"/>
  <circle cx="103" cy="76" r="5" fill="#fbbf24"/>
  <circle cx="122" cy="76" r="5" fill="#5eead4"/>
  <text x="84" y="145" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="2">SOFTWARE ENGINEERING · AI TOOLS</text>
  <text x="80" y="205" fill="url(#accent)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="54" font-weight="700">kraqinc<tspan fill="#e2e8f0">/</tspan></text>
  <text x="84" y="242" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="20">Build useful things. Keep learning. Ship with purpose.</text>
  <g transform="translate(900 115)" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
    <path d="M 0 0 L -42 42 L 0 84"/>
    <path d="M 94 0 L 136 42 L 94 84"/>
    <path d="M 72 -12 L 28 96"/>
  </g>
  <text x="900" y="237" fill="#8fa3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3">BUILD · DEBUG · IMPROVE</text>
</svg>
